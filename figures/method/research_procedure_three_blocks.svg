<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="title desc">
  <title id="title">Research Procedure</title>
  <desc id="desc">A three-block flowchart describing dataset construction, feature generation and training, and evaluation and analysis.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#222222"/>
    </marker>
    <style>
      .title { font-family: "Times New Roman", Times, serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .block-title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #111111; }
      .item { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #111111; }
      .index { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
      .block { fill: #ffffff; stroke: #222222; stroke-width: 2.4; }
      .header { fill: #eeeeee; stroke: #222222; stroke-width: 2.4; }
      .circle { fill: #333333; stroke: #222222; stroke-width: 1.4; }
      .line { stroke: #222222; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .subline { stroke: #b0b0b0; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="20" y="20" width="1460" height="600" fill="#ffffff"/>
  <text x="750" y="72" text-anchor="middle" class="title">Research Procedure</text>

  <!-- Block 1 -->
  <g transform="translate(80,140)">
    <rect x="0" y="0" width="360" height="360" rx="4" class="block"/>
    <rect x="0" y="0" width="360" height="72" rx="4" class="header"/>
    <text x="180" y="46" text-anchor="middle" class="block-title">Dataset Construction</text>

    <circle cx="48" cy="116" r="15" class="circle"/>
    <text x="48" y="123" text-anchor="middle" class="index">1</text>
    <text x="82" y="123" class="item">Collect ToolBench Data</text>
    <line x1="48" y1="138" x2="48" y2="160" class="subline"/>

    <circle cx="48" cy="182" r="15" class="circle"/>
    <text x="48" y="189" text-anchor="middle" class="index">2</text>
    <text x="82" y="189" class="item">Extract Label 0 Pairs</text>
    <line x1="48" y1="204" x2="48" y2="226" class="subline"/>

    <circle cx="48" cy="248" r="15" class="circle"/>
    <text x="48" y="255" text-anchor="middle" class="index">3</text>
    <text x="82" y="255" class="item">Generate Label 1 Pairs</text>
    <line x1="48" y1="270" x2="48" y2="292" class="subline"/>

    <circle cx="48" cy="314" r="15" class="circle"/>
    <text x="48" y="321" text-anchor="middle" class="index">4</text>
    <text x="82" y="321" class="item">Clean and Filter Data</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M460 320 L555 320" class="line"/>

  <!-- Block 2 -->
  <g transform="translate(570,140)">
    <rect x="0" y="0" width="360" height="360" rx="4" class="block"/>
    <rect x="0" y="0" width="360" height="72" rx="4" class="header"/>
    <text x="180" y="32" text-anchor="middle" class="block-title">Feature Generation</text>
    <text x="180" y="58" text-anchor="middle" class="block-title">and Training</text>

    <circle cx="48" cy="116" r="15" class="circle"/>
    <text x="48" y="123" text-anchor="middle" class="index">1</text>
    <text x="82" y="123" class="item">Generate Embeddings</text>
    <line x1="48" y1="138" x2="48" y2="160" class="subline"/>

    <circle cx="48" cy="182" r="15" class="circle"/>
    <text x="48" y="189" text-anchor="middle" class="index">2</text>
    <text x="82" y="189" class="item">Extract Delta Vectors</text>
    <line x1="48" y1="204" x2="48" y2="226" class="subline"/>

    <circle cx="48" cy="248" r="15" class="circle"/>
    <text x="48" y="255" text-anchor="middle" class="index">3</text>
    <text x="82" y="255" class="item">Apply Group Split</text>
    <line x1="48" y1="270" x2="48" y2="292" class="subline"/>

    <circle cx="48" cy="314" r="15" class="circle"/>
    <text x="48" y="321" text-anchor="middle" class="index">4</text>
    <text x="82" y="321" class="item">Train Detection Models</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M950 320 L1045 320" class="line"/>

  <!-- Block 3 -->
  <g transform="translate(1060,140)">
    <rect x="0" y="0" width="360" height="360" rx="4" class="block"/>
    <rect x="0" y="0" width="360" height="72" rx="4" class="header"/>
    <text x="180" y="32" text-anchor="middle" class="block-title">Evaluation</text>
    <text x="180" y="58" text-anchor="middle" class="block-title">and Analysis</text>

    <circle cx="48" cy="116" r="15" class="circle"/>
    <text x="48" y="123" text-anchor="middle" class="index">1</text>
    <text x="82" y="123" class="item">Balanced Setting</text>
    <line x1="48" y1="138" x2="48" y2="160" class="subline"/>

    <circle cx="48" cy="182" r="15" class="circle"/>
    <text x="48" y="189" text-anchor="middle" class="index">2</text>
    <text x="82" y="189" class="item">Class-Ratio Settings</text>
    <line x1="48" y1="204" x2="48" y2="226" class="subline"/>

    <circle cx="48" cy="248" r="15" class="circle"/>
    <text x="48" y="255" class="index" text-anchor="middle">3</text>
    <text x="82" y="255" class="item">Model Comparison</text>
    <line x1="48" y1="270" x2="48" y2="292" class="subline"/>

    <circle cx="48" cy="314" r="15" class="circle"/>
    <text x="48" y="321" class="index" text-anchor="middle">4</text>
    <text x="82" y="321" class="item">Result Analysis</text>
  </g>

  <text x="750" y="556" text-anchor="middle" class="item">Label 0: Normal tool-call pair · Label 1: Mismatch tool-call pair</text>
  <text x="750" y="586" text-anchor="middle" class="item">Feature: prompt embedding − tool embedding</text>
</svg>
